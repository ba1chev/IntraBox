server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 8M;

    # Static assets — serve directly
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Front controller pattern
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Pass env vars from docker-compose to PHP
        fastcgi_param DB_HOST $http_db_host if_not_empty;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }

    # Deny access to non-public dirs (defense in depth — they're already outside root)
    location ~ ^/(src|docker|tests|docs|vendor)/ {
        deny all;
    }
}
